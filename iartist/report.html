<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IArtist downloads</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
body{margin:0;background:#F3E6C9;color:#1E1A17;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:28px;line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding:30px 22px 80px}
h1{font-family:'Abril Fatface',serif;font-weight:400;font-size:2.4em;line-height:1;margin:0 0 6px;color:#800020}
.sub{margin:0 0 26px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:0 0 30px}
.tile{background:#FBF5E6;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:18px 20px}
.tile b{display:block;font-family:'Abril Fatface',serif;font-size:2.6em;line-height:1;color:#800020}
table{width:100%;border-collapse:collapse;background:#fff;border:4px solid #000;font-size:.9em}
th,td{padding:12px 14px;border-bottom:2px solid #000;text-align:left}
th{background:#F2C230;text-transform:uppercase;letter-spacing:.08em;font-size:.7em}
td.n{text-align:right;font-weight:700}
.note{font-size:.7em;color:#5A473C;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>IArtist downloads</h1>
<p class="sub" id="when">Loading...</p>
<div class="big">
  <div class="tile">Page visits<b id="t-page">0</b></div>
  <div class="tile">Downloads to computer<b id="t-download">0</b></div>
  <div class="tile">Opened on a phone<b id="t-phone">0</b></div>
</div>
<table><thead><tr><th>Day</th><th>Visits</th><th>Downloads</th><th>Phone</th></tr></thead><tbody id="rows"></tbody></table>
<p class="note">Numbers only. Nobody's name, email or device is recorded. Counts start September 6, 2026.</p>
</div>
<script>
fetch('/api/iartist', { cache: 'no-store' }).then(r => r.json()).then(d => {
  document.getElementById('t-page').textContent = d.totals.page;
  document.getElementById('t-download').textContent = d.totals.download;
  document.getElementById('t-phone').textContent = d.totals.phone;
  document.getElementById('when').textContent = 'As of ' + new Date().toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  document.getElementById('rows').innerHTML = d.days.map(x => '<tr><td>' + x.day + '</td><td class="n">' + x.page + '</td><td class="n">' + x.download + '</td><td class="n">' + x.phone + '</td></tr>').join('') || '<tr><td colspan="4">Nothing yet.</td></tr>';
}).catch(() => { document.getElementById('when').textContent = 'The counter could not be reached.'; });
</script>
</body>
</html>
